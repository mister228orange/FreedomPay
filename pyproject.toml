[project]
name = "freedompay"
version = "0.1.0"
description = "Lightweight multi-chain crypto payment gateway (merchant acceptor)"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "sqlmodel>=0.0.22",
  "segno>=1.6.0",
  "taskiq>=0.11.0",
  "taskiq-redis>=1.0.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"
