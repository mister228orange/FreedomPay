server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + server-rendered pay pages + OpenAPI
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api:8080/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8080/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api:8080/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /embed.js {
        proxy_pass http://api:8080/embed.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://api:8080/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
